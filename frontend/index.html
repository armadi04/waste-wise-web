<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>WasteWise</title>
    <meta name="description" content="Smart Waste Management Platform" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <script>
      ;(() => {
        let preference
        try {
          const saved = JSON.parse(
            localStorage.getItem('theme-store') || 'null',
          )
          if (typeof saved?.state?.isDark === 'boolean')
            preference = saved.state.isDark
          else {
            const legacy = localStorage.getItem('theme')
            if (legacy === 'dark' || legacy === 'light')
              preference = legacy === 'dark'
          }
        } catch {
          /* Unavailable or malformed storage: use the system preference. */
        }
        const dark =
          preference ??
          window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.remove('light', 'dark')
        document.documentElement.classList.add(dark ? 'dark' : 'light')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        let background = 'gradient'
        try {
          const savedBackground = JSON.parse(
            localStorage.getItem('background-store') || 'null',
          )
          const legacyBackground = localStorage.getItem('background')
          const style =
            savedBackground?.state?.style ?? legacyBackground ?? 'gradient'
          if (['gradient', 'neutral', 'gray'].includes(style))
            background = style
        } catch {
          /* Unavailable or malformed storage: use the default gradient. */
        }
        document.documentElement.dataset.background = background
        document.querySelector('meta[name="theme-color"]').content = dark
          ? '#000000'
          : background === 'gray'
            ? '#f5f5f7'
            : '#ffffff'
      })()
    </script>

    <!-- Fonts: Plus Jakarta Sans (design system typeface) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon_io/favicon.ico"
      sizes="16x16 32x32 48x48"
    />
    <link
      rel="icon"
      type="image/png"
      href="/favicon_io/favicon-32x32.png"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/png"
      href="/favicon_io/favicon-16x16.png"
      sizes="16x16"
    />
    <link rel="apple-touch-icon" href="/favicon_io/apple-touch-icon.png" />

    <!-- PWA / iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WasteWise" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WasteWise" />
    <meta property="og:description" content="Smart Waste Management Platform" />
    <meta property="og:site_name" content="WasteWise" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
