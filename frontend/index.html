<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>Nestplate Starter</title>
    <meta name="description" content="Nestplate Starter dashboard" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <script>
      ;(() => {
        let preference
        try {
          const saved = JSON.parse(
            localStorage.getItem('theme-store') || 'null',
          )
          if (typeof saved?.state?.isDark === 'boolean')
            preference = saved.state.isDark
          else {
            const legacy = localStorage.getItem('theme')
            if (legacy === 'dark' || legacy === 'light')
              preference = legacy === 'dark'
          }
        } catch {
          /* Unavailable or malformed storage: use the system preference. */
        }
        const dark =
          preference ??
          window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.remove('light', 'dark')
        document.documentElement.classList.add(dark ? 'dark' : 'light')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark
          ? '#0F172A'
          : '#F8FAFC'
      })()
    </script>

    <!-- Fonts: Plus Jakarta Sans (design system typeface) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA / iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nestplate" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nestplate Starter" />
    <meta property="og:description" content="Nestplate Starter dashboard" />
    <meta property="og:site_name" content="Nestplate" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
