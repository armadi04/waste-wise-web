name: Frontend CI
on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  push:
    branches: [master]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run optional E2E tests'
        type: boolean
        required: false
        default: false
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
      - run: bun run test:e2e
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
      - uses: actions/upload-artifact@v4
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.run_e2e
        with:
          name: admin-browser-test-results
          path: frontend/test-results/
