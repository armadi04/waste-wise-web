name: Release

# Automated SemVer releases via semantic-release. On every push/merge to `master`,
# semantic-release reads the Conventional Commit messages since the last release
# and:
#   - decides the next version (fix→patch, feat→minor, BREAKING CHANGE→major)
#   - creates the `v<version>` git tag + a GitHub Release with generated notes
#
# It does NOT commit anything back to `master`. The release notes live on the
# GitHub Release, so `master` stays free of `chore(release)` bot commits. The
# in-app Changelog page reads those notes at runtime through
# `GET /api/changelog`, which proxies the GitHub Releases API — see RELEASING.md.
#
# Deployment is deliberately not wired here: this repo is a template, so how a
# fork ships its tags is its own business.
on:
  push:
    branches: [master]

permissions:
  contents: write       # push the version tag, create the Release
  issues: write         # semantic-release comments on resolved issues
  pull-requests: write  # ...and on merged PRs

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history — semantic-release walks tags
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --no-save keeps the tooling out of the tree: it writes node_modules and
      # a stub package.json but no lockfile, and nothing here commits to the
      # repo, so none of it can land in it.
      #
      # Versions are PINNED, not `latest`: semantic-release 24 bundles
      # release-notes-generator 14, whose `conventionalcommits` preset needs
      # conventional-changelog-conventionalcommits 8. Left unpinned, that
      # standalone preset floated to 9 (breaking), and the notes-generator
      # silently emitted EMPTY release bodies while the analyzer still bumped
      # the version — releases then shipped with blank notes and the in-app
      # Changelog page (which drops empty releases) never showed them.
      # Keep these two majors in lockstep on any bump.
      - name: Install semantic-release
        run: >
          bun add --no-save
          semantic-release@24
          conventional-changelog-conventionalcommits@8

      - run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
